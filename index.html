<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Voice Companion</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main class="app">


    <!-- TOP BAR -->

    <header class="top-bar">

      <div class="brand">
        <span class="brand-icon">✦</span>
        <span>AI Companion</span>
      </div>


      <button
        id="settingsBtn"
        class="settings-btn"
      >
        ⚙️
      </button>

    </header>



    <!-- AI ORB -->

    <section class="orb-section">

      <div
        id="orb"
        class="orb"
      >

        <div class="orb-core"></div>

        <div class="orb-ring ring-one"></div>

        <div class="orb-ring ring-two"></div>

        <div class="orb-ring ring-three"></div>

      </div>


      <h1 id="companionName">
        Maya
      </h1>


      <div class="status">

        <span
          id="statusDot"
          class="status-dot"
        ></span>

        <span id="statusText">
          Ready
        </span>

      </div>


      <p id="message">
        Say "Hey Maya" to talk
      </p>

    </section>



    <!-- CHAT AREA -->

    <section
      id="chatBox"
      class="chat-box"
    >

      <div class="welcome-message">

        <div class="welcome-icon">
          ✨
        </div>

        <h2>
          Hi, I'm Maya
        </h2>

        <p>
          Talk to me or type a message below.
        </p>

      </div>

    </section>



    <!-- TEXT INPUT -->

    <section class="chat-input-area">

      <input
        type="text"
        id="chatInput"
        placeholder="Type a message..."
        autocomplete="off"
      >


      <button
        id="sendBtn"
        class="send-btn"
      >
        ➤
      </button>

    </section>



    <!-- VOICE BUTTON -->

    <button
      id="micBtn"
      class="voice-button"
    >

      <span class="mic-icon">
        🎙️
      </span>

      <span>
        Talk
      </span>

    </button>


    <p class="hint">
      Say "Hey Maya" or tap Talk
    </p>


  </main>



  <!-- SETTINGS PANEL -->

  <div
    id="settingsPanel"
    class="settings-panel"
  >

    <div class="settings-card">


      <div class="settings-header">

        <h2>
          ⚙️ Settings
        </h2>

        <button id="closeSettings">
          ✕
        </button>

      </div>



      <!-- NAME -->

      <label>
        Companion Name
      </label>

      <input
        type="text"
        id="nameInput"
        placeholder="Enter companion name"
        maxlength="30"
      >



      <!-- GENDER -->

      <label>
        Companion Type
      </label>

      <div class="gender-options">

        <button id="settingsFemale">
          👩 Female
        </button>

        <button id="settingsMale">
          👨 Male
        </button>

      </div>



      <!-- VOICE -->

      <label>
        Voice
      </label>

      <select id="voiceSelect">

        <option value="">
          Loading voices...
        </option>

      </select>



      <!-- LANGUAGE -->

      <label>
        Language
      </label>

      <select id="languageSelect">

        <option value="en-IN">
          English (India)
        </option>

        <option value="en-US">
          English (US)
        </option>

        <option value="hi-IN">
          Hindi
        </option>

        <option value="te-IN">
          Telugu
        </option>

        <option value="ta-IN">
          Tamil
        </option>

        <option value="kn-IN">
          Kannada
        </option>

        <option value="ml-IN">
          Malayalam
        </option>

      </select>



      <!-- SPEED -->

      <label>
        Voice Speed
      </label>

      <input
        type="range"
        id="speedRange"
        min="0.6"
        max="1.4"
        step="0.1"
        value="1"
      >

      <div class="range-value">
        <span id="speedValue">
          1.0
        </span>
      </div>



      <!-- PITCH -->

      <label>
        Voice Pitch
      </label>

      <input
        type="range"
        id="pitchRange"
        min="0.5"
        max="1.5"
        step="0.1"
        value="1"
      >

      <div class="range-value">
        <span id="pitchValue">
          1.0
        </span>
      </div>



      <!-- WAKE NAME -->

      <div class="wake-box">

        <strong>
          🎙️ Wake Name
        </strong>

        <p id="wakePreview">
          Say "Hey Maya"
        </p>

      </div>



      <!-- SAVE -->

      <button
        id="saveSettings"
        class="save-btn"
      >

        💾 Save Settings

      </button>


    </div>

  </div>



  <script src="script.js"></script>

</body>

</html>
