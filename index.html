<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Voice Companion</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- Top bar -->
    <div class="top-bar">

      <div class="status">
        <span class="dot"></span>
        <span id="statusText">Ready</span>
      </div>

      <button id="settingsBtn" class="settings-btn">
        ⚙️
      </button>

    </div>


    <!-- Companion -->
    <section class="companion">

      <div class="avatar">
        <div class="avatar-face">☺</div>
      </div>

      <h1 id="companionName">Maya</h1>

      <p id="message">
        Say "Hey Maya" to talk with me
      </p>

    </section>


    <!-- Gender selection -->
    <section class="controls">

      <button id="femaleBtn">
        👩 Female
      </button>

      <button id="maleBtn">
        👨 Male
      </button>

    </section>


    <!-- Microphone -->
    <button id="micBtn" class="mic">
      🎙️
    </button>

    <p class="hint">
      Voice-first AI companion
    </p>

  </main>


  <!-- SETTINGS DASHBOARD -->

  <div id="settingsPanel" class="settings-panel">

    <div class="settings-card">

      <div class="settings-header">

        <h2>⚙️ Settings</h2>

        <button id="closeSettings">
          ✕
        </button>

      </div>


      <!-- Companion name -->

      <label>
        Companion Name
      </label>

      <input
        type="text"
        id="nameInput"
        placeholder="Enter companion name"
        maxlength="30"
      >


      <!-- Gender -->

      <label>
        Companion Type
      </label>

      <div class="gender-options">

        <button id="settingsFemale">
          👩 Female
        </button>

        <button id="settingsMale">
          👨 Male
        </button>

      </div>


      <!-- Voice -->

      <label>
        Voice
      </label>

      <select id="voiceSelect">
        <option value="">
          Loading voices...
        </option>
      </select>


      <!-- Language -->

      <label>
        Language
      </label>

      <select id="languageSelect">

        <option value="en-IN">
          English (India)
        </option>

        <option value="en-US">
          English (US)
        </option>

        <option value="hi-IN">
          Hindi
        </option>

        <option value="te-IN">
          Telugu
        </option>

        <option value="ta-IN">
          Tamil
        </option>

        <option value="kn-IN">
          Kannada
        </option>

        <option value="ml-IN">
          Malayalam
        </option>

      </select>


      <!-- Voice speed -->

      <label>
        Voice Speed
      </label>

      <input
        type="range"
        id="speedRange"
        min="0.6"
        max="1.4"
        step="0.1"
        value="1"
      >

      <div class="range-value">
        <span id="speedValue">1.0</span>
      </div>


      <!-- Voice pitch -->

      <label>
        Voice Pitch
      </label>

      <input
        type="range"
        id="pitchRange"
        min="0.5"
        max="1.5"
        step="0.1"
        value="1"
      >

      <div class="range-value">
        <span id="pitchValue">1.0</span>
      </div>


      <!-- Wake name -->

      <div class="wake-box">

        <strong>
          🎙️ Wake Name
        </strong>

        <p id="wakePreview">
          Say "Hey Maya"
        </p>

      </div>


      <!-- Save -->

      <button id="saveSettings" class="save-btn">
        💾 Save Settings
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>

</html>
