<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Companion</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <div class="status">
      <span class="dot"></span>
      <span id="statusText">Ready</span>
    </div>

    <section class="companion">
      <div class="avatar">
        <div class="avatar-face">☺</div>
      </div>

      <h1 id="companionName">Maya</h1>
      <p id="message">Say "Hey Maya" to talk with me</p>
    </section>

    <section class="controls">
      <button id="femaleBtn">👩 Female</button>
      <button id="maleBtn">👨 Male</button>
    </section>

    <button id="micBtn" class="mic">
      🎙️
    </button>

    <p class="hint">
      Voice-first AI companion
    </p>

  </main>

  <script src="script.js"></script>

</body>
</html>
